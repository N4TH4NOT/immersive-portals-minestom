name: Build Minecraft 26.2 and Minestom
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build validateAccessWidener --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: immersive-portals-26.2
          path: |
            build/libs/*.jar
            portal-protocol/build/libs/*.jar
            minestom/build/libs/*.jar
            minestom-example/build/distributions/*.zip
