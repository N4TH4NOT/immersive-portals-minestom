plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.2'
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}
loom { accessWidenerPath = file('src/main/resources/imm_ptl.accesswidener') }
dependencies {
    implementation project(':portal-protocol')
    include project(':portal-protocol')
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "maven.modrinth:cloth-config:${cloth_config_version}"
    include "maven.modrinth:cloth-config:${cloth_config_version}"
    compileOnly "maven.modrinth:modmenu:${modmenu_version}"
    compileOnly "${sodium_path}"
    compileOnly "${iris_path}"
    testImplementation platform('org.junit:junit-bom:5.14.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.compilerArgs += ['-Xmaxerrs', '5000']
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
test { useJUnitPlatform() }
jar { from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } } }
publishing {
    publications { mavenJava(MavenPublication) { from components.java } }
}
