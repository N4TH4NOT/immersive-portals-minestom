plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.2'
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}
loom { accessWidenerPath = file('src/main/resources/imm_ptl.accesswidener') }
dependencies {
    implementation project(':portal-protocol')
    include project(':portal-protocol')
    include 'io.github.n4th4not.gravity:gravity-api:1.0.0-alpha.1'
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "maven.modrinth:cloth-config:${cloth_config_version}"
    include "maven.modrinth:cloth-config:${cloth_config_version}"
    compileOnly "maven.modrinth:modmenu:${modmenu_version}"
    compileOnly "${sodium_path}"
    compileOnly "${iris_path}"
    compileOnly "${gravity_path}"
    if (providers.gradleProperty('portalSmokeGravity').isPresent()) runtimeOnly "${gravity_path}"
    if (providers.gradleProperty('portalSmokeSodium').isPresent() || providers.gradleProperty('portalSmokeIris').isPresent()) runtimeOnly "${sodium_path}"
    if (providers.gradleProperty('portalSmokeIris').isPresent()) runtimeOnly "${iris_path}"
    testImplementation platform('org.junit:junit-bom:5.14.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "${gravity_path}"
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.compilerArgs += ['-Xmaxerrs', '5000']
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
test { useJUnitPlatform() }
jar { from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } } }
tasks.withType(Jar).configureEach { from('licenses') { into 'META-INF/licenses' } }
publishing {
    publications { mavenJava(MavenPublication) { from components.java } }
}

tasks.register('examplePortalDatapack', Zip) {
    from 'examples/custom_portal_gen'
    archiveFileName = 'example_custom_portal_gen.zip'
    destinationDirectory = layout.buildDirectory.dir('examples')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('assemble') { dependsOn 'examplePortalDatapack' }

// Opt-in local runtime verification; these classes are never packaged in the mod.
if (providers.gradleProperty('portalSmoke').isPresent()) {
    sourceSets {
        smokeTest {
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    tasks.named('processSmokeTestResources') {
        from('examples/custom_portal_gen') { into 'migration-example' }
        from(tasks.named('examplePortalDatapack')) { into 'migration-example' }
    }
    def prepareServer = tasks.register('preparePortalSmokeServer') {
        doLast {
            def config = file('run/smoke-server/server.properties')
            if (!config.exists()) {
                config.parentFile.mkdirs()
                config.text = file('src/smokeTest/resources/server.properties').text
            }
        }
    }
    tasks.named('runServer') { dependsOn prepareServer }
    loom {
        mods {
            immersive_portals { sourceSet sourceSets.main }
            imm_ptl_smoke { sourceSet sourceSets.smokeTest }
        }
        runs {
            client {
                source sourceSets.smokeTest
                runDir 'run/smoke-client'
                if (!providers.gradleProperty('portalSmokeSingleplayer').isPresent()) {
                    programArgs '--quickPlayMultiplayer', providers.gradleProperty('portalSmokeAddress').getOrElse('127.0.0.1:25567')
                }
                vmArg '-DportalSmoke.singleplayer=' + providers.gradleProperty('portalSmokeSingleplayer').isPresent()
                vmArg '-DportalSmoke.existingWorld=' + providers.gradleProperty('portalSmokeSingleplayerWorld').getOrElse('')
                vmArg '-DportalSmoke.address=' + providers.gradleProperty('portalSmokeAddress').getOrElse('127.0.0.1:25567')
                vmArg '-DportalSmoke.target=' + providers.gradleProperty('portalSmokeTarget').getOrElse('minecraft:the_nether')
                vmArg '-DportalSmoke.interaction=' + providers.gradleProperty('portalSmokeInteraction').getOrElse('false')
                vmArg '-DportalSmoke.interactions=' + providers.gradleProperty('portalSmokeInteractions').getOrElse('false')
                vmArg '-DportalSmoke.rendering=' + providers.gradleProperty('portalRenderSmoke').getOrElse('false')
                vmArg '-Dimm_ptl.renderDiagnostics=true'
                vmArg '-DportalSmoke.gravity=' + providers.gradleProperty('portalGravitySmoke').getOrElse('false')
            }
            server { source sourceSets.smokeTest; runDir 'run/smoke-server' }
        }
    }
    if (providers.gradleProperty('portalSmokeIris').isPresent()) {
        def prepareShaders = tasks.register('preparePortalSmokeShaders') {
            inputs.dir 'src/smokeTest/shaders'
            outputs.dir 'run/smoke-client/shaderpacks/PortalSmoke'
            outputs.file 'run/smoke-client/config/iris.properties'
            doLast {
                def shaders = file('run/smoke-client/shaderpacks/PortalSmoke/shaders')
                shaders.mkdirs()
                ['terrain', 'entities', 'hand', 'hand_water', 'water', 'block', 'textured', 'textured_lit', 'basic'].each { program ->
                    new File(shaders, "gbuffers_${program}.vsh").text = file('src/smokeTest/shaders/gbuffers_terrain.vsh').text
                    new File(shaders, "gbuffers_${program}.fsh").text = file("src/smokeTest/shaders/gbuffers_${program == 'basic' ? 'basic' : 'terrain'}.fsh").text
                }
                new File(shaders, 'shaders.properties').text = file('src/smokeTest/shaders/shaders.properties').text
                def config = file('run/smoke-client/config/iris.properties')
                config.parentFile.mkdirs()
                config.text = 'enableShaders=true\nshaderPack=PortalSmoke\n'
            }
        }
        tasks.named('runClient') { dependsOn prepareShaders }
    }
}
