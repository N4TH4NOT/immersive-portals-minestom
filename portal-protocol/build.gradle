plugins { id 'java-library'; id 'maven-publish' }
tasks.withType(Jar).configureEach { from(rootProject.file('licenses/GravityChanger-MIT.txt')) { into 'META-INF/licenses' } }
group = rootProject.group
version = rootProject.version
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
repositories { mavenCentral() }
dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
publishing { publications { mavenJava(MavenPublication) { from components.java } } }
