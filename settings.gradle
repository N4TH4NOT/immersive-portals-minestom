rootProject.name = "immersive-portals-minestom"
include "portal-protocol", "minestom", "minestom-example"


def gravitySources = providers.gradleProperty('gravitySourceDir')
    .map { file(it) }.getOrElse(file('dependencies/gravity'))
if (!new File(gravitySources, 'settings.gradle').isFile()) {
    throw new GradleException('Gravity sources missing: run git submodule update --init --recursive, or pass -PgravitySourceDir=/path/to/immersive-portals-gravity')
}
includeBuild(gravitySources) { name = 'immersive-portals-gravity' }
gradle.ext.gravitySources = gravitySources
